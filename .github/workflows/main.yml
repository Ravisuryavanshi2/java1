name: Java CI/CD Workflow

on:
  push:
    branches:
      - master  # Trigger on pushes to the 'master' branch of the current repository
  pull_request:
    branches:
      - master  # Trigger on pull requests to the 'master' branch of the current repository

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean install

    - name: Check build output (debug step)
      run: |
        echo "Checking contents of target directory"
        ls -al target/  # List contents of the target directory
        if [ ! -f target/*.war ]; then
          echo "WAR file not found in target directory. Exiting..."
          exit 1
        fi

    - name: Upload Artifacts (WAR file)
      uses: actions/upload-artifact@v3
      with:
        name: my-java-artifact
        path: target/*.war  # Use *.war for WAR file instead of *.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Test SSH connection
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} 'echo SSH connection successful!' || (echo "SSH connection failed" && exit 1)

    - name: Install Tomcat on EC2 (if not already installed)
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          # Install necessary dependencies
          sudo apt update -y
          sudo apt install -y openjdk-11-jdk wget unzip

          # Download and install Tomcat if not already installed
          if [ ! -d "/opt/tomcat" ]; then
            cd /opt
            sudo wget https://downloads.apache.org/tomcat/tomcat-9/v9.0.58/bin/apache-tomcat-9.0.58.tar.gz
            sudo tar xvf apache-tomcat-9.0.58.tar.gz
            sudo ln -s apache-tomcat-9.0.58 tomcat

            # Start Tomcat
            sudo /opt/tomcat/bin/startup.sh

            # Open necessary ports (HTTP 8080)
            sudo ufw allow 8080
          else
            echo "Tomcat is already installed."
          fi
        EOF

    - name: Deploy to Tomcat on EC2
      run: |
        echo "Deploying current repository to the server..."
        if [ ! -f target/*.war ]; then
          echo "WAR file not found in target directory. Exiting..."
          exit 1
        fi
        scp target/*.war ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/target/  # Upload WAR file to EC2 target directory

    - name: Copy WAR file to Tomcat Webapps Directory
      run: |
        echo "Copying WAR file to Tomcat webapps directory on EC2..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          sudo cp /home/ubuntu/target/*.war /opt/tomcat/webapps/
        EOF

    - name: Restart Tomcat on EC2
      run: |
        echo "Restarting Tomcat on EC2..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          sudo /opt/tomcat/bin/shutdown.sh
          sudo /opt/tomcat/bin/startup.sh
        EOF
