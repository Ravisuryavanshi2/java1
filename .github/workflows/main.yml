name: Java CI/CD Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: self-hosted

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'

    - name: Build with Maven
      run: mvn clean install

    # Debugging step to check if the WAR file exists in the target directory
    - name: List contents of target directory
      run: |
        echo "Listing contents of the target directory"
        ls -al target/

    - name: Check WAR file existence
      run: |
        echo "Checking for WAR file in target directory"
        if [ ! -f target/*.war ]; then
          echo "WAR file not found in target directory. Exiting..."
          exit 1
        fi

    - name: Upload Artifacts (WAR file)
      uses: actions/upload-artifact@v3
      with:
        name: my-java-artifact
        path: target/*.war

  deploy:
    runs-on: self-hosted
    needs: build

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Test SSH connection
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} 'echo SSH connection successful!' || (echo "SSH connection failed" && exit 1)

    - name: Deploy to Tomcat on EC2
      run: |
        echo "Deploying current repository to the server..."
        if [ ! -f target/*.war ]; then
          echo "WAR file not found in target directory. Exiting..."
          exit 1
        fi
        scp target/*.war ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/target/  # Upload WAR file to EC2 target directory

    - name: Copy WAR file to Tomcat Webapps Directory
      run: |
        echo "Copying WAR file to Tomcat webapps directory on EC2..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          sudo cp /home/ubuntu/target/*.war /opt/tomcat/webapps/
        EOF

    - name: Restart Tomcat on EC2
      run: |
        echo "Restarting Tomcat on EC2..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          sudo /opt/tomcat/bin/shutdown.sh
          sudo /opt/tomcat/bin/startup.sh
        EOF
