name: Java CI/CD Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'adoptopenjdk'

    - name: Build with Maven
      run: mvn clean install

    - name: Run Tests
      run: mvn test

    - name: Upload Artifacts (JAR file)
      uses: actions/upload-artifact@v3
      with:
        name: my-java-artifact
        path: target/*.jar  # Adjust path if needed

  deploy:
    runs-on: ubuntu-latest
    needs: build  # This means deploy only runs after the build job finishes

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Deploy to Server (Example)
      run: |
        echo "Deploying project to the server..."
        # Example command to deploy to a remote server (use your deployment steps here)
        scp target/*.jar user@server:/path/to/deployment/directory/
