name: Java CI/CD Workflow

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin'
        check-latest: false

    - name: Build with Maven
      run: mvn clean install

    - name: List target directory contents
      run: |
        ls -l target/

    - name: Run Tests
      run: mvn test

    - name: Upload Artifacts (JAR file)
      uses: actions/upload-artifact@v3
      with:
        name: my-java-artifact
        path: target/*.jar  # Adjust path if needed

    - name: Checkout External Repository (java1) from 'master' branch
      uses: actions/checkout@v3
      with:
        repository: 'Ravisuryavanshi2/java1'
        ref: 'refs/heads/master'
        token: ${{ secrets.GITHUB_TOKEN }}
        path: repo-java1

    - name: Build External Repository (java1)
      run: |
        cd repo-java1
        mvn clean install

    - name: List external repository target directory contents
      run: |
        ls -l repo-java1/target/

    - name: Run Tests for External Repository (java1)
      run: |
        cd repo-java1
        mvn test

    - name: Upload External Repository Artifacts (JAR file)
      uses: actions/upload-artifact@v3
      with:
        name: java1-artifact
        path: repo-java1/target/*.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Test SSH connection
      run: |
        echo "Testing SSH connection..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} 'echo SSH connection successful!' || (echo "SSH connection failed" && exit 1)

    - name: Deploy Current Repository
      run: |
        echo "Deploying current repository to the server..."
        scp target/*.jar ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }}:/path/to/deployment/dir  # Adjust path if needed

    - name: Deploy External Repository Artifact (java1)
      run: |
        echo "Deploying external repository (java1) artifact..."
        scp repo-java1/target/*.jar ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }}:/path/to/deployment/dir  # Adjust path if needed
