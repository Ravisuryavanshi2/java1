name: Java CI/CD Workflow

on:
  push:
    branches:
      - master  # Trigger on pushes to the 'master' branch of the current repository
  pull_request:
    branches:
      - master  # Trigger on pull requests to the 'master' branch of the current repository

jobs:
  build:
    runs-on: self-hosted  # Use a self-hosted runner for building

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    # Set up JDK 17 (for consistency with your pom.xml)
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'  # Make sure this matches the Java version in your pom.xml
        distribution: 'temurin'

    # Install Maven if needed
    - name: Install Maven
      run: |
        sudo apt update -y
        sudo apt install -y maven

    # Verify Maven installation
    - name: Verify Maven installation
      run: mvn -v

    # Build with Maven
    - name: Build with Maven
      run: mvn clean install

    # Debug: List contents of the target directory to confirm WAR file presence
    - name: List contents of target directory
      run: |
        echo "Listing contents of target directory"
        ls -al target/

    # Check for WAR file existence
    - name: Check WAR file existence
      run: |
        echo "Checking for WAR file in target directory"
        if [ ! -f target/*.war ]; then
          echo "WAR file not found in target directory. Exiting..."
          exit 1
        fi

    # Upload WAR file as an artifact
    - name: Upload Artifacts (WAR file)
      uses: actions/upload-artifact@v3
      with:
        name: my-java-artifact
        path: target/*.war

  deploy:
    runs-on: self-hosted  # Use the self-hosted runner for the deployment step
    needs: build  # Ensure deploy only runs after the build is successful

    steps:
    - name: Checkout Current Repository (master branch)
      uses: actions/checkout@v3
      with:
        ref: 'refs/heads/master'

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

    - name: Test SSH connection
      run: |
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} 'echo SSH connection successful!' || (echo "SSH connection failed" && exit 1)

    - name: Deploy to Tomcat on EC2
      run: |
        echo "Deploying current repository to the server..."
        if [ ! -f target/*.war ]; then
          echo "WAR file not found in target directory. Exiting..."
          exit 1
        fi
        scp target/*.war ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }}:/home/ubuntu/target/

    - name: Copy WAR file to Tomcat Webapps Directory
      run: |
        echo "Copying WAR file to Tomcat webapps directory on EC2..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          sudo cp /home/ubuntu/target/*.war /opt/tomcat/webapps/
        EOF

    - name: Restart Tomcat on EC2
      run: |
        echo "Restarting Tomcat on EC2..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ secrets.SERVER_IP }} << 'EOF'
          sudo /opt/tomcat/bin/shutdown.sh
          sudo /opt/tomcat/bin/startup.sh
        EOF
